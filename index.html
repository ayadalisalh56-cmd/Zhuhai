<!doctype html>
<html lang="ku" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مەکۆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script>try{document.documentElement.dataset.theme=JSON.parse(localStorage.getItem('meko.v2')).dark?'dark':'light'}catch(e){}</script>
</head>
<body>
<main id="app"></main>
<nav id="nav" class="nav" aria-label="سەرەکی">
  <button data-a="go" data-v="feed" id="n-feed" aria-label="گۆڕەپان"><i data-lucide="home"></i></button>
  <button data-a="new" class="plus" aria-label="پۆستی نوێ"><i data-lucide="plus"></i></button>
  <button data-a="go" data-v="dm" id="n-dm" aria-label="نامەدان"><i data-lucide="message-circle"></i><span class="dot" id="n-dot"></span></button>
  <button data-a="go" data-v="menu" id="n-menu" class="avbtn" aria-label="مینیو"><span class="av" id="n-av"></span><span class="mb"><i data-lucide="menu"></i></span></button>
</nav>
<div id="toast" class="toast"></div>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="unicode-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
