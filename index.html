<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ژیر — Zhir | دەستەپیچە زیرەکی دەستکرد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --bg-soft:#ffffff; --bg-chat:#eceef1;
  --surface:#ffffff; --surface-2:#f0f1f4;
  --text:#14161a; --text-2:#5b6470; --text-3:#9aa3ae;
  --border:#e3e6ea; --border-2:#d4d8de;
  --accent:#6c5ce7; --accent-2:#8f7ff5; --accent-soft:rgba(108,92,231,.12);
  --user-bubble:#14161a; --user-text:#ffffff;
  --ai-bubble:#ffffff; --ai-text:#14161a;
  --shadow:0 10px 40px -12px rgba(20,22,26,.18);
  --shadow-sm:0 2px 10px -2px rgba(20,22,26,.08);
  --danger:#e5484d;
  --radius:22px;
}
html[data-theme="dark"]{
  --bg:#0b0d12; --bg-soft:#10131a; --bg-chat:#0e1117;
  --surface:#161a23; --surface-2:#1d2230;
  --text:#eef0f4; --text-2:#9aa3b2; --text-3:#626b7a;
  --border:#232936; --border-2:#2e3546;
  --accent:#8f7ff5; --accent-2:#a89af8; --accent-soft:rgba(143,127,245,.15);
  --user-bubble:#2b3040; --user-text:#eef0f4;
  --ai-bubble:#1a1f2b; --ai-text:#eef0f4;
  --shadow:0 14px 48px -14px rgba(0,0,0,.6);
  --shadow-sm:0 3px 14px -4px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"Noto Sans Arabic","Noto Kufi Arabic",sans-serif;
  background:var(--bg); color:var(--text);
  overflow:hidden; transition:background .35s ease,color .35s ease;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:99px}

/* ===== چوارچێوەی گشتی ===== */
.app{display:flex;height:100dvh;width:100%}

/* ===== سایدبار ===== */
.sidebar{
  width:288px;flex-shrink:0;display:flex;flex-direction:column;
  background:var(--bg-soft);border-inline-end:1px solid var(--border);
  transition:transform .35s cubic-bezier(.32,.72,.28,1),background .35s ease;
}
.sidebar-head{display:flex;align-items:center;gap:12px;padding:20px 18px 14px}
.logo-badge{
  width:44px;height:44px;border-radius:13px;flex-shrink:0;
  display:grid;place-items:center;background:#000;
  box-shadow:0 6px 18px -6px rgba(0,0,0,.45);
}
.logo-badge svg{width:30px;height:30px}
.brand-name{font-size:21px;font-weight:800;letter-spacing:-.3px}
.brand-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.new-chat-btn{
  margin:6px 16px 14px;display:flex;align-items:center;justify-content:center;gap:8px;
  padding:13px;border-radius:14px;font-size:14.5px;font-weight:700;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 8px 22px -8px var(--accent);
  transition:transform .2s ease,box-shadow .25s ease;
}
.new-chat-btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px -8px var(--accent)}
.new-chat-btn:active{transform:scale(.97)}
.sidebar-label{padding:4px 22px 8px;font-size:11px;font-weight:600;color:var(--text-3)}
.chat-list{flex:1;overflow-y:auto;padding:0 10px 10px;display:flex;flex-direction:column;gap:4px}
.chat-item{
  display:flex;align-items:center;gap:10px;padding:11px 13px;border-radius:13px;
  color:var(--text-2);font-size:13.5px;cursor:pointer;position:relative;
  transition:background .18s ease,color .18s ease;border:1px solid transparent;
}
.chat-item:hover{background:var(--surface-2)}
.chat-item.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.chat-item .ci-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-item .ci-del{
  width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex-shrink:0;
  color:var(--text-3);opacity:0;transition:opacity .18s,background .18s,color .18s;
}
.chat-item:hover .ci-del{opacity:1}
.chat-item .ci-del:hover{background:rgba(229,72,77,.14);color:var(--danger)}
.empty-chats{padding:26px 16px;text-align:center;color:var(--text-3);font-size:12.5px;line-height:2}
.sidebar-foot{padding:14px 16px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar-mini{
  width:34px;height:34px;border-radius:11px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),#e05fa0);
  display:grid;place-items:center;color:#fff;font-size:14px;font-weight:800;
}
.user-name{font-size:13px;font-weight:700}
.user-plan{font-size:11px;color:var(--text-3)}

/* ===== ناوەڕۆکی سەرەکی ===== */
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.topbar{
  height:60px;flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:0 16px;border-bottom:1px solid var(--border);
  background:color-mix(in srgb,var(--bg-soft) 75%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  z-index:20;
}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  color:var(--text-2);transition:background .18s,color .18s;flex-shrink:0;
}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.topbar-title{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar-status{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--text-3)}
.dot-live{width:7px;height:7px;border-radius:50%;background:#2fbf71;box-shadow:0 0 0 3px rgba(47,191,113,.18);animation:pulse 2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(47,191,113,.05)}}

/* ===== ناوچەی چات ===== */
.chat-area{flex:1;overflow-y:auto;scroll-behavior:smooth}
.chat-inner{max-width:820px;margin:0 auto;padding:26px 18px 18px;display:flex;flex-direction:column;gap:18px}

/* ڕووکارە سەرەتایی */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:7vh 20px 30px;animation:fadeUp .6s ease both}
.hero-logo{width:96px;height:96px;border-radius:26px;background:#000;display:grid;place-items:center;box-shadow:var(--shadow);margin-bottom:24px}
.hero-logo svg{width:64px;height:64px}
.hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.5px}
.hero h1 span{background:linear-gradient(135deg,var(--accent),#e05fa0);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--text-2);font-size:15px;margin-top:10px;max-width:460px;line-height:2}
.sugg-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;width:100%;max-width:640px;margin-top:34px}
.sugg-card{
  text-align:right;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--border);transition:transform .2s,border-color .2s,box-shadow .2s;
}
.sugg-card:hover{transform:translateY(-3px);border-color:var(--accent);box-shadow:var(--shadow-sm)}
.sugg-card .sc-icon{width:36px;height:36px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:10px}
.sugg-card h4{font-size:13.5px;font-weight:700}
.sugg-card p{font-size:12px;color:var(--text-3);margin-top:5px;line-height:1.9}

/* نامەکان */
.msg{display:flex;gap:12px;max-width:88%;animation:msgIn .38s cubic-bezier(.22,1,.36,1) both}
@keyframes msgIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.msg.user{align-self:flex-start;flex-direction:row-reverse}
.msg.ai{align-self:flex-end}
.msg-avatar{
  width:36px;height:36px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;margin-top:2px;
}
.msg.user .msg-avatar{background:linear-gradient(135deg,var(--accent),#e05fa0);color:#fff;font-size:14px;font-weight:800}
.msg.ai .msg-avatar{background:#000;padding:5px}
.msg.ai .msg-avatar svg{width:100%;height:100%}
.msg-body{display:flex;flex-direction:column;gap:7px;min-width:0}
.bubble{
  padding:12px 16px;border-radius:18px;font-size:14.5px;line-height:2.05;white-space:pre-wrap;word-break:break-word;
}
.msg.user .bubble{background:var(--user-bubble);color:var(--user-text);border-start-end-radius:5px;box-shadow:var(--shadow-sm)}
.msg.ai .bubble{background:var(--ai-bubble);color:var(--ai-text);border:1px solid var(--border);border-start-start-radius:5px;box-shadow:var(--shadow-sm)}
.msg-time{font-size:10.5px;color:var(--text-3);padding:0 4px}
.msg.user .msg-time{text-align:left}
.msg-img{max-width:230px;border-radius:14px;border:1px solid var(--border);display:block}
.msg-file{
  display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:14px;
  background:var(--surface-2);border:1px solid var(--border);font-size:13px;max-width:230px;
}
.msg-file svg{flex-shrink:0;color:var(--accent)}
.copy-btn{
  align-self:flex-start;display:flex;align-items:center;gap:5px;font-size:11.5px;
  color:var(--text-3);padding:5px 10px;border-radius:9px;transition:all .18s;
}
.copy-btn:hover{background:var(--surface-2);color:var(--text)}
.copy-btn.copied{color:#2fbf71}

/* نیشاندەری بیرکردنەوە */
.typing{display:flex;gap:5px;padding:6px 2px;align-items:center}
.typing span{width:7px;height:7px;border-radius:50%;background:var(--text-3);animation:tp 1.2s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes tp{0%,60%,100%{transform:none;opacity:.4}30%{transform:translateY(-6px);opacity:1}}

/* ===== بۆکسی ژێرەوە ===== */
.composer-zone{flex-shrink:0;padding:10px 16px calc(14px + env(safe-area-inset-bottom));position:relative;z-index:15}
.composer{max-width:820px;margin:0 auto}
.attach-preview{
  display:none;gap:10px;align-items:center;margin-bottom:8px;padding:9px 12px;
  background:var(--surface);border:1px solid var(--border);border-radius:14px;width:fit-content;max-width:100%;
  box-shadow:var(--shadow-sm);animation:fadeUp .3s ease both;
}
.attach-preview.show{display:flex}
.attach-preview img{width:44px;height:44px;object-fit:cover;border-radius:10px}
.attach-preview .ap-icon{width:44px;height:44px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex-shrink:0}
.ap-name{font-size:12.5px;font-weight:600;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ap-size{font-size:10.5px;color:var(--text-3)}
.ap-remove{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
.ap-remove:hover{background:rgba(229,72,77,.12);color:var(--danger)}
.input-wrap{
  display:flex;align-items:flex-end;gap:8px;
  background:var(--surface);border:1.5px solid var(--border-2);border-radius:24px;
  padding:8px 8px 8px 14px;box-shadow:var(--shadow);transition:border-color .25s,box-shadow .25s;
}
html[dir="rtl"] .input-wrap{padding:8px 14px 8px 8px}
.input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.input-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.input-actions .icon-btn{width:38px;height:38px}
#input{
  flex:1;border:none;outline:none;background:transparent;resize:none;color:var(--text);
  font-family:inherit;font-size:15px;line-height:1.8;padding:8px 4px;max-height:170px;min-height:24px;
}
#input::placeholder{color:var(--text-3)}
.send-btn{
  width:42px;height:42px;border-radius:15px;flex-shrink:0;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
  transition:transform .18s,opacity .18s,box-shadow .2s;box-shadow:0 6px 16px -6px var(--accent);
}
.send-btn:hover{transform:translateY(-2px)}
.send-btn:disabled{opacity:.4;transform:none;box-shadow:none;cursor:not-allowed}
.hint{text-align:center;font-size:11px;color:var(--text-3);margin-top:9px}

/* ئۆڤەرلەی مۆبایل */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:30;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}

@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

/* ===== مۆبایل ===== */
.menu-btn{display:none}
@media (max-width:820px){
  .sidebar{position:fixed;inset-block:0;inset-inline-start:0;z-index:40;transform:translateX(110%);box-shadow:var(--shadow)}
  html[dir="rtl"] .sidebar{transform:translateX(110%)}
  .sidebar.open{transform:translateX(0)}
  .menu-btn{display:grid}
  .msg{max-width:100%}
  .topbar-status{display:none}
  .sugg-grid{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="app">
  <!-- ============ سایدبار ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-badge">
        <svg viewBox="0 0 100 100" fill="none">
          <path d="M30 78 V50 Q30 34 44 34 L56 34 Q70 34 70 50 V78"
                stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M44 62 L52 26 Q54 16 61 16 Q67 16 66 26 L62 44"
                stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M58 56 L72 24 Q76 15 83 18 Q89 21 85 31 L74 58"
                stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">ژیر</div>
        <div class="brand-sub">Zhir AI • دەستەپیچە زیرەک</div>
      </div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      گفتوگۆی نوێ
    </button>

    <div class="sidebar-label">گفتوگۆکانت</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-foot">
      <div class="avatar-mini">هـ</div>
      <div>
        <div class="user-name">بەکارهێنەر</div>
        <div class="user-plan">پلەی بێسەرهێڵ</div>
      </div>
    </div>
  </aside>

  <!-- ============ ناوەڕۆک ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="لیستە">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      </button>
      <div class="topbar-title" id="topbarTitle">گفتوگۆی نوێ</div>
      <div class="topbar-status"><span class="dot-live"></span> ئۆنلاین</div>
      <button class="icon-btn" id="themeBtn" aria-label="دۆخی ڕووناکی">
        <svg id="iconMoon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg id="iconSun" style="display:none" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner">
        <!-- ڕووکارە سەرەتایی -->
        <div class="hero" id="hero">
          <div class="hero-logo">
            <svg viewBox="0 0 100 100" fill="none">
              <path d="M30 78 V50 Q30 34 44 34 L56 34 Q70 34 70 50 V78"
                    stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M44 62 L52 26 Q54 16 61 16 Q67 16 66 26 L62 44"
                    stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M58 56 L72 24 Q76 15 83 18 Q89 21 85 31 L74 58"
                    stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <h1>سڵاو، من <span>ژیر</span>م! ✌</h1>
          <p>دەستەپیچە زیرەکی دەستکردی کوردی. هەر پرسیارێک، نووسینێک یان بیرۆکەیەکت هەیە — با قسە بکەین!</p>
          <div class="sugg-grid">
            <button class="sugg-card" data-q="باشترین ڕێگا بۆ فێربوونی پرۆگرامسازی چییە؟">
              <div class="sc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m8 6-6 6 6 6M16 6l6 6-6 6"/></svg></div>
              <h4>فێربوونی کۆد</h4><p>باشترین ڕێگا بۆ فێربوونی پرۆگرامسازی</p>
            </button>
            <button class="sugg-card" data-q="یارمەتیم بدە نامەیەکی فەرمی بۆ داواکردنی کار بنووسم">
              <div class="sc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></div>
              <h4>نووسین</h4><p>نامەی فەرمی و دەقی پرۆفیشناڵ</p>
            </button>
            <button class="sugg-card" data-q="چیرۆکێکی کوردیی کورت بۆ منداڵان بڵێ">
              <div class="sc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5Z"/></svg></div>
              <h4>چیرۆک</h4><p>چیرۆکی کوردیی کورت و جوان</p>
            </button>
            <button class="sugg-card" data-q="پلانێکم بۆ دەستپێکردنی پڕۆژەی تایبەت بە مۆبایل بدە">
              <div class="sc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M12 18h.01"/></svg></div>
              <h4>پلاندانان</h4><p>پلان بۆ پڕۆژە و بیرۆکە نوێکان</p>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- ============ بۆکسی نووسین ============ -->
    <div class="composer-zone">
      <div class="composer">
        <div class="attach-preview" id="attachPreview">
          <div id="apThumb"></div>
          <div style="min-width:0">
            <div class="ap-name" id="apName"></div>
            <div class="ap-size" id="apSize"></div>
          </div>
          <button class="ap-remove" id="apRemove" aria-label="لابردن">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="input-wrap">
          <div class="input-actions">
            <button class="icon-btn" id="attachBtn" aria-label="هاوپێچکردن">
              <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
            </button>
            <input type="file" id="fileInput" hidden accept="image/*,.pdf,.txt,.doc,.docx">
          </div>
          <textarea id="input" rows="1" placeholder="نامەکەت بنووسە..."></textarea>
          <button class="send-btn" id="sendBtn" aria-label="ناردن">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
          </button>
        </div>
        <div class="hint">ژیر دەتوانێت هەڵە بکات — زانیاریی گرنگ پشتڕاست بکەرەوە.</div>
      </div>
    </div>
  </main>
</div>

<script>
/* ================================================================
   ژیر (Zhir) — لۆجیکی ناوخۆیی
   تێبینی: بۆ گرێدان بە API ڕاستەقینە، تەنیا فەنکشنی
   fakeAIReply() بگۆڕە بە fetch() بۆ سێرڤەرەکەت.
================================================================ */
const $ = s => document.querySelector(s);
const LS_KEY = "zhir_chats_v1";
const LS_THEME = "zhir_theme";

/* ---------- دۆخی ڕووناک/تاریک ---------- */
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  $("#iconMoon").style.display = t === "dark" ? "none" : "block";
  $("#iconSun").style.display  = t === "dark" ? "block" : "none";
  localStorage.setItem(LS_THEME, t);
}
applyTheme(localStorage.getItem(LS_THEME) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
$("#themeBtn").onclick = () => applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ---------- سۆرسی داتا ---------- */
let chats = [];
try { chats = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch(e){ chats = []; }
let currentId = chats.length ? chats[0].id : null;

function save(){ localStorage.setItem(LS_KEY, JSON.stringify(chats)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowTime(){ return new Date().toLocaleTimeString("ckb-IQ", {hour:"2-digit", minute:"2-digit"}); }
function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

/* ---------- ڕەندەری سایدبار ---------- */
function renderSidebar(){
  const list = $("#chatList");
  list.innerHTML = "";
  if(!chats.length){
    list.innerHTML = '<div class="empty-chats">هیچ گفتوگۆیەک نییە.<br>یەکەم گفتوگۆت لەمێرە دەست پێبکە ✨</div>';
    return;
  }
  chats.forEach(c => {
    const item = document.createElement("div");
    item.className = "chat-item" + (c.id === currentId ? " active" : "");
    const title = c.messages.find(m => m.role === "user")?.text?.slice(0,34) || "گفتوگۆی نوێ";
    item.innerHTML = `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/></svg>
      <span class="ci-text">${esc(title)}</span>
      <button class="ci-del" aria-label="سڕینەوە"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m2 0v14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6"/></svg></button>`;
    item.onclick = e => {
      if(e.target.closest(".ci-del")) return;
      currentId = c.id; renderAll(); closeSidebar();
    };
    item.querySelector(".ci-del").onclick = ev => {
      ev.stopPropagation();
      chats = chats.filter(x => x.id !== c.id);
      if(currentId === c.id) currentId = chats[0]?.id || null;
      save(); renderAll();
    };
    list.appendChild(item);
  });
}

/* ---------- ڕەندەری چات ---------- */
function currentChat(){ return chats.find(c => c.id === currentId); }
const LOGO_SVG = `<svg viewBox="0 0 100 100" fill="none"><path d="M30 78 V50 Q30 34 44 34 L56 34 Q70 34 70 50 V78" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 62 L52 26 Q54 16 61 16 Q67 16 66 26 L62 44" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M58 56 L72 24 Q76 15 83 18 Q89 21 85 31 L74 58" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function renderMessage(m, animate){
  const wrap = document.createElement("div");
  wrap.className = "msg " + m.role;
  let content = "";
  if(m.attachment){
    if(m.attachment.type === "image") content += `<img class="msg-img" src="${m.attachment.data}" alt="">`;
    else content += `<div class="msg-file"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg><span>${esc(m.attachment.name)}</span></div>`;
  }
  if(m.text) content += `<div class="bubble">${esc(m.text)}</div>`;
  let copyBtn = "";
  if(m.role === "ai" && m.text){
    copyBtn = `<button class="copy-btn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg><span>کۆپیکردن</span></button>`;
  }
  wrap.innerHTML = `<div class="msg-avatar">${m.role === "user" ? "هـ" : LOGO_SVG}</div>
    <div class="msg-body">${content}${copyBtn}<div class="msg-time">${m.time || ""}</div></div>`;
  if(copyBtn){
    const btn = wrap.querySelector(".copy-btn");
    btn.onclick = () => {
      navigator.clipboard.writeText(m.text).then(() => {
        btn.classList.add("copied");
        btn.querySelector("span").textContent = "کۆپی کرا ✓";
        setTimeout(() => { btn.classList.remove("copied"); btn.querySelector("span").textContent = "کۆپیکردن"; }, 1800);
      });
    };
  }
  return wrap;
}

function renderAll(){
  const inner = $("#chatInner");
  inner.innerHTML = "";
  const c = currentChat();
  if(c && c.messages.length){
    c.messages.forEach(m => inner.appendChild(renderMessage(m, false)));
    $("#topbarTitle").textContent = c.messages.find(m => m.role === "user")?.text?.slice(0,40) || "گفتوگۆ";
  } else {
    inner.innerHTML = document.getElementById("heroTemplate").innerHTML;
    bindSugg();
    $("#topbarTitle").textContent = "گفتوگۆی نوێ";
  }
  renderSidebar();
  scrollBottom(false);
}
function scrollBottom(smooth = true){
  const area = $("#chatArea");
  area.scrollTo({top: area.scrollHeight, behavior: smooth ? "smooth" : "auto"});
}

/* ---------- دروستکردنی گفتوگۆ ---------- */
function newChat(){
  const c = {id: uid(), created: Date.now(), messages: []};
  chats.unshift(c);
  currentId = c.id;
  save(); renderAll(); closeSidebar();
  $("#input").focus();
}
$("#newChatBtn").onclick = newChat;

/* ---------- ناردنی نامە ---------- */
const input = $("#input"), sendBtn = $("#sendBtn");
let pendingFile = null;

function autoGrow(){
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 170) + "px";
}
input.addEventListener("input", autoGrow);
input.addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});

function sendMessage(forcedText){
  const text = (forcedText ?? input.value).trim();
  if(!text && !pendingFile) return;
  let c = currentChat();
  if(!c){ newChat(); c = currentChat(); }

  const msg = {role:"user", text, time: nowTime()};
  if(pendingFile){
    msg.attachment = pendingFile;
    msg.text = text || "ئەم فایلە هاوپێچ دەکەم:";
  }
  c.messages.push(msg);
  save(); renderAll();

  input.value = ""; autoGrow(); clearAttachment();
  fakeReply(c, text);
}
sendBtn.onclick = () => sendMessage();

/* ---------- وەڵامی ژیر (نموونەیی — لێرە API ببەستە) ---------- */
function fakeAIReply(userText){
  const pool = [
`سڵاو! پرسیارێکی جوانە. 😊

بۆ ئەوەی باشترین یارمەتیت بدەم، با بە وردی قسە بکەین. ئەگەر دەتەوێت:

١. وردتر بم لەسەر بابەتەکە
٢. نموونەی جێبەجێ بخەمەڕوو
٣. ڕێنمایی هەنگاوبەهەنگا بڵێ

تەنیا بڵێ کام یەک! هەروەها دەتوانیت فایل یان وێنەش هاوپێچ بکەیت و من شیکاری دەکەم. من هەرلێرەم بۆ یارمەتیدانت! ✌`,
`زۆر باشە! بیرۆکەکەت زۆر بەنرخە. 💡

با پلانەکە بەم شێوەیە دابنێین:

• هەنگاوی یەکەم: دیاریکردنی ئامانجەکان
• هەنگاوی دووەم: کۆکردنەوەی زانیاری پێویست
• هەنگاوی سێیەم: جێبەجێکردن و پێداچوونەوە

ئەگەر وردتر باسی بابەتەکە بکەیت، من پلانێکی تایبەت و وردترت بۆ دادەنێم. چ دەڵێی؟`,
`سوپاس بۆ ناردنی ئەمە! 🙌

وەڵامەکەم لەم خاڵانەدایە: تێگەیشتم لە داواکارییەکەت و ئامادەم بۆ یارمەتیدانت. ئەمە تەنیا وەڵامێکی نموونەییە — کاتێک API ڕاستەقینە ببەسترێت، من بە تەواوی زیرەک وەرەدەبم!

ئایا پێویستت بە وردکردنەوەی زیاتر هەیە؟`
  ];
  const t = (userText || "").toLowerCase();
  if(t.includes("کۆد") || t.includes("پرۆگرام")) return pool[0];
  if(t.includes("پلان") || t.includes("پڕۆژە")) return pool[1];
  return pool[Math.floor(Math.random() * pool.length)];
}

function fakeReply(chat, userText){
  // نیشاندەری بیرکردنەوە
  const typingEl = document.createElement("div");
  typingEl.className = "msg ai";
  typingEl.innerHTML = `<div class="msg-avatar">${LOGO_SVG}</div>
    <div class="msg-body"><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  $("#chatInner").appendChild(typingEl);
  scrollBottom();

  setTimeout(() => {
    typingEl.remove();
    const full = fakeAIReply(userText);
    const msg = {role:"ai", text:"", time: nowTime()};
    chat.messages.push(msg);
    renderAll();

    // ئەنیمەیشنی نووسینەوە
    const bubbles = document.querySelectorAll(".msg.ai .bubble");
    const bubble = bubbles[bubbles.length - 1];
    let i = 0;
    const timer = setInterval(() => {
      i += 2 + Math.floor(Math.random() * 3);
      if(i >= full.length){
        i = full.length; clearInterval(timer);
        msg.text = full; save();
      }
      bubble.textContent = full.slice(0, i);
      scrollBottom();
    }, 28);
  }, 1100 + Math.random() * 900);
}

/* ---------- هاوپێچکردنی فایل ---------- */
$("#attachBtn").onclick = () => $("#fileInput").click();
$("#fileInput").onchange = e => {
  const f = e.target.files[0];
  if(!f) return;
  const isImg = f.type.startsWith("image/");
  const reader = new FileReader();
  reader.onload = () => {
    pendingFile = {name: f.name, size: (f.size/1024).toFixed(0) + " KB", type: isImg ? "image" : "file", data: reader.result};
    $("#apThumb").innerHTML = isImg
      ? `<img src="${reader.result}" alt="">`
      : `<div class="ap-icon"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg></div>`;
    $("#apName").textContent = f.name;
    $("#apSize").textContent = pendingFile.size;
    $("#attachPreview").classList.add("show");
  };
  isImg ? reader.readAsDataURL(f) : reader.readAsDataURL(f);
  e.target.value = "";
};
function clearAttachment(){
  pendingFile = null;
  $("#attachPreview").classList.remove("show");
}
$("#apRemove").onclick = clearAttachment;

/* ---------- سەنجاقەکانی پێشنیاز ---------- */
function bindSugg(){
  document.querySelectorAll(".sugg-card").forEach(card => {
    card.onclick = () => sendMessage(card.dataset.q);
  });
}

/* ---------- مۆبایل سایدبار ---------- */
const sidebar = $("#sidebar"), overlay = $("#overlay");
function closeSidebar(){ sidebar.classList.remove("open"); overlay.classList.remove("show"); }
$("#menuBtn").onclick = () => { sidebar.classList.add("open"); overlay.classList.add("show"); };
overlay.onclick = closeSidebar;

/* ---------- دەستپێک ---------- */
const heroHTML = $(".hero").outerHTML;
document.body.insertAdjacentHTML("beforeend", `<template id="heroTemplate">${heroHTML}</template>`);
bindSugg();
renderAll();
</script>
</body>
</html>
