<!doctype html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f9fa" />
  <title>ژیر — یاریدەدەری زیرەکی کوردی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --user-bubble: #f0f4f9;
      --ink: #1f1f1f;
      --muted: #444746;
      --line: rgba(0, 0, 0, 0.08);
      --line-strong: rgba(0, 0, 0, 0.14);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      --font-kurdish: "Noto Sans Arabic", sans-serif;
    }

    html.dark {
      --bg: #131314;
      --surface: #1e1f20;
      --user-bubble: #282a2c;
      --ink: #e3e3e3;
      --muted: #c4c7c5;
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.15);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-kurdish);
      overflow: hidden;
    }

    .app-layout {
      display: flex;
      width: 100%;
      height: 100dvh;
      position: relative;
    }

    /* سایدبار */
    .sidebar {
      width: 280px;
      height: 100%;
      background: var(--bg);
      background-color: color-mix(in srgb, var(--bg) 95%, transparent);
      border-left: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
    }
    
    .brand-header { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
    .brand-logo { width: 34px; height: 34px; background: #000; border-radius: 8px; display: grid; place-items: center; }
    html.dark .brand-logo { background: #fff; }
    .brand-logo svg path { stroke: #fff; }
    html.dark .brand-logo svg path { stroke: #000; }
    .brand-title { font-size: 18px; font-weight: 800; }

    .new-chat-btn {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 20px;
      background: var(--user-bubble); border: 0; color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .theme-toggle-btn { padding: 10px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 13px; cursor: pointer; }
    
    .scrim { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 90; }

    /* بەشی سەرەکی */
    .main-content {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .topbar { height: 60px; display: flex; align-items: center; padding: 0 16px; z-index: 10; }
    .menu-btn { display: none; background: transparent; border: 0; color: var(--ink); cursor: pointer; padding: 8px; }

    /* شوێنی چات */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px 16px 140px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .welcome-box { margin: auto 0; text-align: center; }
    .welcome-box h1 {
      font-size: 28px; font-weight: 700; margin-top: 12px;
      background: linear-gradient(135deg, #1f1f1f, #5f6368); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    html.dark .welcome-box h1 { background: linear-gradient(135deg, #ffffff, #9aa0a6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .messages-stream { width: min(800px, 100%); display: flex; flex-direction: column; gap: 32px; }
    
    .message-bubble { display: flex; gap: 16px; width: 100%; }
    .message-bubble.user, .message-bubble.assistant { justify-content: flex-start; }
    
    .assistant-avatar { width: 36px; height: 36px; background: #000; border-radius: 50%; display: grid; place-items: center; flex-shrink: 0; }
    html.dark .assistant-avatar { background: #fff; }
    .assistant-avatar svg path { stroke: #fff; }
    html.dark .assistant-avatar svg path { stroke: #000; }
    
    .user-avatar-placeholder { width: 36px; height: 36px; flex-shrink: 0; }
    
    .message-content-wrapper { display: flex; flex-direction: column; max-width: calc(100% - 52px); }
    
    .user .text-content { 
      background: var(--user-bubble); color: var(--ink); 
      padding: 14px 20px; border-radius: 8px 24px 24px 24px; 
      line-height: 1.7; font-size: 15px; width: fit-content;
    }
    
    .assistant .text-content { 
      background: transparent; color: var(--ink); 
      padding: 4px 0 0 0; line-height: 1.85; font-size: 15px; 
    }

    /* ✨ ئەنیمەیشنی بیرکردنەوە (قۆناغی سێیەم) */
    .thinking-anim {
      width: 36px; height: 36px; background: #000; border-radius: 8px;
      display: grid; place-items: center; flex-shrink: 0;
      animation: pulseGlow 1.2s infinite alternate ease-in-out;
    }
    html.dark .thinking-anim { background: #fff; animation: pulseGlowDark 1.2s infinite alternate ease-in-out; }
    .thinking-anim svg path { stroke: #fff; }
    html.dark .thinking-anim svg path { stroke: #000; }

    @keyframes pulseGlow {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0,0,0,0.2); }
      100% { transform: scale(1.1); box-shadow: 0 0 15px 5px rgba(0,0,0,0.1); }
    }
    @keyframes pulseGlowDark {
      0% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(255,255,255,0.2); }
      100% { transform: scale(1.1); box-shadow: 0 0 15px 5px rgba(255,255,255,0.1); }
    }

    .action-bar { display: flex; gap: 4px; margin-top: 12px; opacity: 0; transition: opacity 0.5s ease; }
    .action-bar.show { opacity: 1; }
    .action-bar button { 
      background: transparent; border: none; color: var(--muted); 
      padding: 8px; border-radius: 50%; cursor: pointer; 
      transition: background 0.2s; display: grid; place-items: center; 
    }
    .action-bar button:hover { background: var(--user-bubble); color: var(--ink); }
    .action-bar svg { width: 18px; height: 18px; }

    /* بۆکسی نووسین */
    .composer-container {
      position: fixed; bottom: max(16px, env(safe-area-inset-bottom));
      left: 0; right: 0; width: min(800px, calc(100% - 32px));
      margin: 0 auto; z-index: 50;
    }
    .composer-box {
      display: flex; align-items: flex-end; gap: 12px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--line-strong);
      border-radius: 50px; padding: 10px 16px;
      box-shadow: var(--shadow); transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }
    html.dark .composer-box { background: rgba(30, 31, 32, 0.75); }
    .composer-box:focus-within { box-shadow: 0 12px 36px rgba(0,0,0,0.15); border-color: var(--muted); }
    html.dark .composer-box:focus-within { box-shadow: 0 12px 36px rgba(0,0,0,0.6); }
    .composer-box textarea {
      flex: 1; max-height: 150px; min-height: 24px; border: 0; background: transparent; color: var(--ink);
      font-family: inherit; font-size: 15px; line-height: 1.6; resize: none; outline: none; padding: 6px 0;
    }
    .composer-box textarea::placeholder { color: var(--muted); }
    .action-btn {
      background: transparent; border: 0; color: var(--muted); cursor: pointer; padding: 8px;
      display: grid; place-items: center; border-radius: 50%; flex-shrink: 0;
    }
    .action-btn:hover { background: var(--user-bubble); color: var(--ink); }
    .send-btn { color: var(--ink); }
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .menu-btn { display: block; }
      .sidebar { position: fixed; top: 0; right: 0; transform: translateX(100%); }
      .sidebar.open { transform: translateX(0); }
      .sidebar.open + .scrim { display: block; }
      .chat-container { padding-top: 10px; }
      .composer-box { padding: 8px 12px; }
      .message-content-wrapper { max-width: calc(100% - 46px); }
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="brand-header">
        <div class="brand-logo">
          <svg width="20" height="20" viewBox="0 0 100 100" fill="none"><path d="M34 35c-3-11-14-12-18-5-3 6 1 13 7 24l8 14c-5-7-14-7-18-1-4 6 1 14 8 21 11 11 28 13 42 6 15-8 21-23 17-37l-8-25c-4-13-17-11-20-3-1 3 0 7 1 12l3 14-13-26c-5-10-17-7-17 2 0 2 1 4 3 7l14 24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <span class="brand-title">ژیر</span>
      </div>
      <button class="new-chat-btn" id="newChatBtn">＋ گفتوگۆی نوێ</button>
      <div class="history-list" id="historyList"></div>
      <button class="theme-toggle-btn" id="themeBtn">دۆخی تاریک / ڕووناک</button>
    </aside>
    <div class="scrim" id="scrim"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="مێنۆ">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </header>

      <div class="chat-container" id="chatContainer">
        <div class="welcome-box" id="welcomeBox">
          <div class="brand-logo" style="width: 48px; height: 48px; margin: 0 auto; border-radius: 12px;">
            <svg width="28" height="28" viewBox="0 0 100 100" fill="none"><path d="M34 35c-3-11-14-12-18-5-3 6 1 13 7 24l8 14c-5-7-14-7-18-1-4 6 1 14 8 21 11 11 28 13 42 6 15-8 21-23 17-37l-8-25c-4-13-17-11-20-3-1 3 0 7 1 12l3 14-13-26c-5-10-17-7-17 2 0 2 1 4 3 7l14 24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <h1>سڵاو، چۆن دەتوانم یارمەتیت بدەم؟</h1>
        </div>
        <div class="messages-stream" id="messagesStream"></div>
      </div>

      <div class="composer-container">
        <form class="composer-box" id="composerForm">
          <button type="button" class="action-btn attach-btn" aria-label="پاشکۆ">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <textarea id="userInput" rows="1" placeholder="پرسیارێک لە ژیر بکە..."></textarea>
          <button type="button" class="action-btn mic-btn" id="micBtn" aria-label="دەنگ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2a3 3 0 00-3 3v7a3 3 0 006 0V5a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
          </button>
          <button type="submit" class="action-btn send-btn hidden" id="sendBtn" aria-label="ناردن">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script>
    const root = document.documentElement;
    const themeBtn = document.getElementById('themeBtn');
    const menuBtn = document.getElementById('menuBtn');
    const sidebar = document.getElementById('sidebar');
    const scrim = document.getElementById('scrim');
    const composerForm = document.getElementById('composerForm');
    const userInput = document.getElementById('userInput');
    const micBtn = document.getElementById('micBtn');
    const sendBtn = document.getElementById('sendBtn');
    const messagesStream = document.getElementById('messagesStream');
    const welcomeBox = document.getElementById('welcomeBox');
    const chatContainer = document.getElementById('chatContainer');
    const newChatBtn = document.getElementById('newChatBtn');

    if (localStorage.getItem('zhir-theme') === 'dark') root.classList.add('dark');
    themeBtn.addEventListener('click', () => {
      root.classList.toggle('dark');
      localStorage.setItem('zhir-theme', root.classList.contains('dark') ? 'dark' : 'light');
    });

    function toggleMenu(open) { sidebar.classList.toggle('open', open); }
    menuBtn.addEventListener('click', () => toggleMenu(true));
    scrim.addEventListener('click', () => toggleMenu(false));

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
      if (userInput.value.trim().length > 0) {
        micBtn.classList.add('hidden'); sendBtn.classList.remove('hidden');
      } else {
        micBtn.classList.remove('hidden'); sendBtn.classList.add('hidden');
      }
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); composerForm.requestSubmit(); }
    });

    // زیادکردنی نامەی بەکارهێنەر ڕاستەوخۆ
    function appendUserMessage(text) {
      const bubble = document.createElement('div');
      bubble.className = `message-bubble user`;
      bubble.innerHTML = `
        <div class="user-avatar-placeholder"></div>
        <div class="message-content-wrapper">
          <div class="text-content">${text.replace(/\n/g, '<br>')}</div>
        </div>
      `;
      messagesStream.appendChild(bubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ✨ ناردنی وەڵامی ژیر بە لێشاو (Streaming Effect)
    function streamAssistantMessage(text) {
      const bubble = document.createElement('div');
      bubble.className = `message-bubble assistant`;
      
      const actionButtons = `
        <div class="action-bar" id="actionBar-${Date.now()}">
          <button aria-label="کۆپیکردن" title="کۆپیکردن"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg></button>
          <button aria-label="بەسوود بوو" title="بەسوود بوو"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"></path></svg></button>
          <button aria-label="کێشەی هەیە" title="کێشەی هەیە"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3zm7-13h2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-2"></path></svg></button>
          <button aria-label="دووبارە وەڵامدانەوە" title="دووبارە وەڵامدانەوە"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6M3 12a9 9 0 0 1 15-6.7L21 8M3 22v-6h6M21 12a9 9 0 0 1-15 6.7L3 16"></path></svg></button>
        </div>`;

      bubble.innerHTML = `
        <div class="assistant-avatar"><svg width="18" height="18" viewBox="0 0 100 100" fill="none"><path d="M34 35c-3-11-14-12-18-5-3 6 1 13 7 24l8 14c-5-7-14-7-18-1-4 6 1 14 8 21 11 11 28 13 42 6 15-8 21-23 17-37l-8-25c-4-13-17-11-20-3-1 3 0 7 1 12l3 14-13-26c-5-10-17-7-17 2 0 2 1 4 3 7l14 24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <div class="message-content-wrapper">
          <div class="text-content" id="textContent-${Date.now()}"></div>
          ${actionButtons}
        </div>
      `;
      messagesStream.appendChild(bubble);
      
      const textElement = bubble.querySelector('.text-content');
      const actionBar = bubble.querySelector('.action-bar');
      
      let i = 0;
      // نیشاندانی پیت بە پیت بۆ دروستکردنی هەستی بیرکردنەوەی زیندوو
      const interval = setInterval(() => {
        textElement.innerHTML += text.charAt(i) === '\n' ? '<br>' : text.charAt(i);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        i++;
        if (i >= text.length) {
          clearInterval(interval);
          actionBar.classList.add('show'); // دەرخستنی دوگمەکان دوای تەواوبوونی نووسین
        }
      }, 25);
    }

    composerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = userInput.value.trim();
      if (!val) return;

      welcomeBox.style.display = 'none';
      appendUserMessage(val);
      
      userInput.value = '';
      userInput.style.height = 'auto';
      micBtn.classList.remove('hidden'); sendBtn.classList.add('hidden');

      // نیشاندانی ئەنیمەیشنی بیرکردنەوە بەر لە وەڵامدانەوە
      const thinkingBubble = document.createElement('div');
      thinkingBubble.className = `message-bubble assistant`;
      thinkingBubble.innerHTML = `
        <div class="thinking-anim">
          <svg width="20" height="20" viewBox="0 0 100 100" fill="none"><path d="M34 35c-3-11-14-12-18-5-3 6 1 13 7 24l8 14c-5-7-14-7-18-1-4 6 1 14 8 21 11 11 28 13 42 6 15-8 21-23 17-37l-8-25c-4-13-17-11-20-3-1 3 0 7 1 12l3 14-13-26c-5-10-17-7-17 2 0 2 1 4 3 7l14 24" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      `;
      messagesStream.appendChild(thinkingBubble);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      // دوای ١.٥ چرکە لە بیرکردنەوە، دەست دەکات بە نووسینی وەڵام
      setTimeout(() => {
        thinkingBubble.remove();
        streamAssistantMessage('سڵاو! من «ژیر»م.\nئێستا دیزاینەکەم بەتەواوی ئامادەیە. هەروەک دەبینیت، سەرەتا بیرم کردەوە، پاشانیش وەڵامەکەم بە لێشاو (Streaming) بۆت نووسی.\nئەمە ڕێک ئەو هەستەیە کە لە جەمینای وەری دەگریت!');
      }, 1500);
    });

    newChatBtn.addEventListener('click', () => {
      messagesStream.innerHTML = '';
      welcomeBox.style.display = 'block';
      toggleMenu(false);
    });
  </script>
</body>
</html>
