<!DOCTYPE html>
<html lang="ku" dir="rtl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مەکۆ — پلاتفۆرمی یەکگرتنی کوردان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { bg: 'var(--bg)', elev: 'var(--elev)', hov: 'var(--hov)', line: 'var(--line)', fg: 'var(--fg)', mute: 'var(--mute)' },
  fontFamily: { lit: ['Amiri', 'Noto Naskh Arabic', 'serif'] } } } };
</script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-bg text-fg antialiased">

<div class="mx-auto flex max-w-[1320px]">

  <!-- Right: navigation sidebar (desktop) -->
  <aside class="hidden md:flex sticky top-0 h-screen w-[232px] shrink-0 flex-col justify-between border-l border-line px-4 py-6">
    <div>
      <a href="#feed" class="mb-8 flex items-baseline gap-2 px-3">
        <span class="font-lit text-4xl font-bold leading-none">مەکۆ</span>
        <span class="text-xs text-mute">Meko</span>
      </a>
      <nav class="flex flex-col gap-1" aria-label="ناوەڕۆکی سەرەکی">
        <button class="nav-btn" data-act="tab" data-tab="feed"><i data-lucide="newspaper"></i><span>گۆڕەپان</span></button>
        <button class="nav-btn" data-act="tab" data-tab="library"><i data-lucide="library"></i><span>کتێبخانە و ئەرشیف</span></button>
        <button class="nav-btn" data-act="tab" data-tab="dm"><i data-lucide="mail"></i><span>نامەدان</span></button>
        <button class="nav-btn" data-act="tab" data-tab="profile"><i data-lucide="user-round"></i><span>پڕۆفایل</span></button>
      </nav>
    </div>
    <button class="nav-btn" data-act="theme" aria-label="گۆڕینی ڕووکار">
      <i data-lucide="sun" class="t-dark"></i><i data-lucide="moon" class="t-light"></i><span>گۆڕینی ڕووکار</span>
    </button>
  </aside>

  <!-- Center: content -->
  <main class="min-h-screen min-w-0 flex-1 border-l border-line pb-24 md:pb-0">
    <header class="topbar sticky top-0 z-20 flex h-[57px] items-center justify-between border-b border-line px-5">
      <h1 id="view-title" class="font-semibold"></h1>
      <span class="font-lit text-xl md:hidden">مەکۆ</span>
    </header>

    <!-- 1. Timeline -->
    <section id="view-feed" class="view">
      <div class="card m-4 p-4" data-uni-wrap>
        <div class="flex gap-3">
          <span class="avatar" id="me-av">ئ</span>
          <textarea id="c-text" class="field flex-1" rows="2" data-uni placeholder="بیرۆکەیەکی زمانەوانی یان ئەدەبی بنووسە..."></textarea>
        </div>
        <p id="poem-hint" class="hint hidden">بۆ بەیت: دوو میسراع بە نیشانەی | لە یەک جیا بکەرەوە، هەر دێڕێک بەیتێکە.</p>
        <div class="mt-3 flex flex-wrap items-center gap-2 border-t border-line pt-3">
          <select id="c-dialect" class="select" aria-label="زاراوە"></select>
          <select id="c-tag" class="select" aria-label="بابەت"></select>
          <div class="mx-auto"></div>
          <div class="uni-status"><i data-lucide="shield-check"></i><span class="uni-txt">پارێزەری یونیکۆد چالاکە (UTF-8 Pure)</span></div>
          <button class="btn" data-act="publish">بڵاوکردنەوە</button>
        </div>
      </div>
      <div id="feed" class="grid gap-4 px-4 pb-6"></div>
    </section>

    <!-- 2. Library -->
    <section id="view-library" class="view hidden">
      <div class="flex flex-wrap gap-3 p-4">
        <label class="field-wrap flex-1"><i data-lucide="search"></i>
          <input id="lib-q" class="bare" data-uni placeholder="گەڕان بە ناونیشان، نووسەر یان زاراوە..."></label>
        <button class="btn" data-act="addbook"><i data-lucide="plus"></i>زیادکردنی پەڕتووک / دەقی خاو</button>
      </div>
      <div id="lib-tabs" class="tabs px-4"></div>
      <div id="lib-list" class="grid gap-4 p-4 sm:grid-cols-2"></div>
    </section>

    <!-- 3. Direct messages -->
    <section id="view-dm" class="view hidden">
      <div id="dm-wrap" data-m="list">
        <aside id="dm-list" class="dm-list"></aside>
        <div class="dm-chat">
          <div id="dm-head" class="dm-head"></div>
          <div id="dm-msgs" class="dm-msgs"></div>
          <div class="dm-form" data-uni-wrap>
            <textarea id="dm-in" class="field" rows="1" data-uni placeholder="نامەیەک بنووسە..."></textarea>
            <div class="mt-2 flex items-center justify-between">
              <div class="uni-status"><i data-lucide="shield-check"></i><span class="uni-txt">پارێزەری یونیکۆد چالاکە (UTF-8 Pure)</span></div>
              <button class="btn sm" data-act="sendmsg"><i data-lucide="send"></i>ناردن</button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 4. Profile -->
    <section id="view-profile" class="view hidden"><div id="prof"></div></section>
  </main>

  <!-- Left: discovery panel -->
  <aside id="side" class="hidden lg:grid sticky top-0 h-screen w-[290px] shrink-0 content-start gap-8 overflow-y-auto p-6"></aside>
</div>

<!-- Bottom bar (mobile) -->
<nav class="bottombar md:hidden" aria-label="ناوەڕۆکی سەرەکی">
  <button class="bb" data-act="tab" data-tab="feed"><i data-lucide="newspaper"></i><span>گۆڕەپان</span></button>
  <button class="bb" data-act="tab" data-tab="library"><i data-lucide="library"></i><span>کتێبخانە</span></button>
  <button class="bb" data-act="tab" data-tab="dm"><i data-lucide="mail"></i><span>نامەدان</span></button>
  <button class="bb" data-act="tab" data-tab="profile"><i data-lucide="user-round"></i><span>پڕۆفایل</span></button>
  <button class="bb" data-act="theme" aria-label="گۆڕینی ڕووکار"><i data-lucide="sun" class="t-dark"></i><i data-lucide="moon" class="t-light"></i><span>ڕووکار</span></button>
</nav>

<!-- Raw TXT reader -->
<div id="m-txt" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-bg" data-act="close"></div>
  <div class="modal-box wide">
    <header class="modal-h">
      <div><h2 id="txt-title" class="font-lit text-xl"></h2><p id="txt-stats" class="mt-1 text-xs text-mute"></p></div>
      <button class="iconbtn" data-act="close" aria-label="داخستن"><i data-lucide="x"></i></button>
    </header>
    <ol id="txt-body" class="txt-lines"></ol>
    <footer class="modal-f">
      <button class="btn ghost" data-act="copytxt"><i data-lucide="copy"></i>کۆپیکردنی تەواوی دەق</button>
      <button class="btn" data-act="dltxt2"><i data-lucide="download"></i>داگرتن بە فۆرماتی .TXT</button>
    </footer>
  </div>
</div>

<!-- Add book -->
<div id="m-add" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-bg" data-act="close"></div>
  <div class="modal-box">
    <header class="modal-h"><h2 class="font-semibold">زیادکردنی پەڕتووک / دەقی خاو</h2>
      <button class="iconbtn" data-act="close" aria-label="داخستن"><i data-lucide="x"></i></button></header>
    <div class="modal-b grid gap-3" data-uni-wrap>
      <input id="ab-title" class="field" data-uni placeholder="ناونیشانی پەڕتووک">
      <input id="ab-author" class="field" data-uni placeholder="نووسەر">
      <div class="grid grid-cols-2 gap-3">
        <select id="ab-dialect" class="select"></select>
        <select id="ab-cat" class="select">
          <option value="ling">زمان و فەرهەنگ</option><option value="poetry">دیوانی شیعر</option><option value="other">ئەدەبیات و مێژوو</option>
        </select>
      </div>
      <input id="ab-pdf" class="field" dir="ltr" placeholder="PDF: ناوی فایل یان بەستەر (https://...)">
      <textarea id="ab-txt" class="field" rows="7" data-uni placeholder="دەقی یونیکۆد یان نایونیکۆد لێرە بلکێنە؛ بە شێوەی خۆکار دەکرێت بە UTF-8ـی پاک..."></textarea>
      <div class="flex flex-wrap items-center justify-between gap-2">
        <label class="btn ghost sm cursor-pointer"><i data-lucide="upload"></i>هەڵبژاردنی فایلی .txt<input id="ab-file" type="file" accept=".txt,text/plain" class="hidden"></label>
        <div class="uni-status"><i data-lucide="shield-check"></i><span class="uni-txt">پارێزەری یونیکۆد چالاکە (UTF-8 Pure)</span></div>
      </div>
    </div>
    <footer class="modal-f"><button class="btn ghost" data-act="close">پاشگەزبوونەوە</button><button class="btn" data-act="savebook">خستنە ئەرشیف</button></footer>
  </div>
</div>

<!-- Share -->
<div id="m-share" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modal-bg" data-act="close"></div>
  <div class="modal-box narrow">
    <header class="modal-h"><h2 class="font-semibold">شەیرکردن</h2>
      <button class="iconbtn" data-act="close" aria-label="داخستن"><i data-lucide="x"></i></button></header>
    <div id="share-body" class="modal-b"></div>
  </div>
</div>

<div id="toasts" aria-live="polite"></div>

<script src="unicode-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
